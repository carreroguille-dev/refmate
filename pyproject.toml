[project]
name = "refmate"
version = "0.1.0"
description = "Asistente arbitral de balonmano con RAG agéntico"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "flagembedding>=1.3.5",
    "httpx>=0.28.1",
    "llama-index>=0.14.18",
    "llama-index-vector-stores-qdrant>=0.10.0",
    "loguru>=0.7.3",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "pypdfium2>=5.6.0",
    "python-dotenv>=1.2.2",
    "python-telegram-bot[all]>=22.7",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.17.1",
    "redis>=7.3.0",
    "transformers<5.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipython>=9.11.0",
    "mypy>=1.19.1",
    "ruff>=0.15.6",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.hatch.build.targets.wheel]
packages = ["src/refmate"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
